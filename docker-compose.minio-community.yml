services:
  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z@sha256:8793e960474071520bdb91bb9a6d1793eb229fdbc9dcb7ec75ad836b69bbab40
    container_name: epss-minio
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - server
      - /data
      - --address
      - ":9000"
      - --console-address
      - ":9001"
    env_file:
      - .env.minio.community
    volumes:
      - epss-minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:19001:9001"

volumes:
  epss-minio-data:
    driver: local
